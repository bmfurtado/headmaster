                      x-kubernetes-int-or-string: true
                    description: "Requests describes the minimum amount of compute resources required. If Requests is omitted for a container, it defaults to Limits if that is explicitly specified, otherwise to an implementation-defined value. Requests cannot exceed Limits. More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
                    type: object
                type: object
              scim:
                description: |-
                  SCIM 2.0 server configuration. When set, the operator deploys a SCIM sidecar
                  and validates that `spec.policy.inline` contains no `groups` key.
                nullable: true
                properties:
                  expireNodesOnChange:
                    default: false
                    description: |-
                      When true, expire all of a user's headscale nodes when the identifier
                      used by `policyUserKey` changes (e.g. email change in `email` mode,
                      username rename in `username` mode). Forces immediate OIDC re-authentication.
                      Not needed for `external_id` mode — the ProviderIdentifier never changes.
                      Default: false.
                    type: boolean
                  oidcIssuer:
                    description: |-
                      OIDC issuer URL (e.g. `"https://pocket-id.example.com"`).
                      Required when `policyUserKey` is `"external_id"`.
                    nullable: true
                    type: string
                  policyUserKey:
                    description: |-
                      Controls which identifier is written into headscale policy group entries
                      and used to locate a user's headscale nodes for session management.
                      Values: `"email"` (default), `"username"`, `"external_id"`.
                      Use `"external_id"` with Pocket ID or Authentik for the most stable
                      identifier (maps to the OIDC `sub` claim / headscale `ProviderIdentifier`).
                    enum:
                    - email
                    - username
                    - external_id
                    nullable: true
                    type: string
                  storage:
                    default:
                      size: 1Gi
                      storageClass: null
                    description: Persistent storage for the external-ID mapping file.
                    properties:
                      size:
                        default: 1Gi
                        description: PVC storage request (e.g. `1Gi`).
                        minLength: 1
                        type: string
                      storageClass:
                        description: StorageClass to use. Omit to use the cluster default.
                        minLength: 1
                        nullable: true
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: oidcIssuer is required when policyUserKey is 'external_id'
                  rule: "!has(self.policyUserKey) || self.policyUserKey != 'external_id' || has(self.oidcIssuer)"
              serverUrl:
                description: |-
                  Publicly-reachable URL of this headscale server, used for Magic DNS and DERP
                  configuration (e.g. `https://headscale.example.com`).
                minLength: 1
                type: string
              storage:
                default:
                  size: 1Gi
                  storageClass: null
                description: |-
                  Persistent storage for the headscale SQLite database.
                  Ignored when `external` is set.
                properties:
                  size:
                    default: 1Gi
                    description: PVC storage request (e.g. `1Gi`).
                    minLength: 1
                    type: string
                  storageClass:
                    description: StorageClass to use. Omit to use the cluster default.
                    minLength: 1
                    nullable: true
                    type: string
                type: object
              watchedNamespaces:
                default:
                - "*"
                description: |-
                  Namespaces from which `headmaster` Ingresses may reference this instance.
                  `["*"]` (the default) allows Ingresses from any namespace; `[]` denies all;
                  a specific list restricts to those namespaces only.
                items:
                  type: string
                type: array
            required:
            - dnsBaseDomain
            - serverUrl
            type: object
          status:
            description: Observed state of a `HeadscaleInstance`.
            nullable: true
            properties:
              conditions:
                default: []
                description: Current conditions for this instance.
                items:
                  description: >-
                    Condition contains details for one aspect of the current state of this API
                    Resource.
                  properties:
                    lastTransitionTime:
                      description: >-
                        lastTransitionTime is the last time the condition transitioned from one status
                        to another. This should be when the underlying condition changed.  If that is not
                        known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: >-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      type: string
                    observedGeneration:
                      description: >-
                        observedGeneration represents the .metadata.generation that the condition was
                        set based upon. For instance, if .metadata.generation is currently 12, but the
                        .status.conditions[x].observedGeneration is 9, the condition is out of date with
                        respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: >-
                        reason contains a programmatic identifier indicating the reason for the
                        condition's last transition. Producers of specific condition types may define expected
                        values and meanings for this field, and whether the values are considered a
                        guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                default: 0
                description: Generation of the spec this status was computed from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        title: HeadscaleInstance
        type: object
    served: true
    storage: true
    subresources:
      status: {}
