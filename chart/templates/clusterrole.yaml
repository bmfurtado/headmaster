apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "headmaster.fullname" . }}
  labels:
    {{- include "headmaster.labels" . | nindent 4 }}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, create, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  # get: named-port resolution for Ingress backends in any namespace.
  # list/watch: the ExternalName Service controller watches Services
  # cluster-wide for the headmaster config annotation.
  # patch: claimed-by annotation and finalizer management on adopted Services.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, patch]
