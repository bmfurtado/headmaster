apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "headmaster.fullname" . }}
  labels:
    {{- include "headmaster.labels" . | nindent 4 }}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, create, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  # Named-port resolution: Ingress backends may reference Service ports by
  # name, and the Ingress can live in any namespace.
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
