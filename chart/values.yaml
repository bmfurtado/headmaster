# Map of HeadscaleInstance resources to create. Keys are resource names.
headscaleInstances: {}

headscaleImage:
  repository: headscale/headscale
  tag: v0.29.2

proxyImage:
  repository: tailscale/tailscale
  tag: v1.98.8

socatImage:
  repository: alpine/socat
  tag: 1.8.0.3

tunDevice:
  # How tun-mode proxy pods (Ingresses or exposed Services with
  # "mode": "tun") get access to /dev/net/tun.
  #   privileged    — privileged container + hostPath /dev/net/tun (default).
  #   device-plugin — request one devicePluginResource unit and add only
  #                   CAP_NET_ADMIN; needs a device plugin advertising the
  #                   resource (e.g. squat/generic-device-plugin) and the
  #                   kubelet to allow the net.ipv4.ip_forward and
  #                   net.ipv6.conf.all.forwarding sysctls.
  access: privileged
  # Extended-resource name requested in device-plugin mode.
  devicePluginResource: squat.ai/tun

egressDns:
  # Maintain a `headmaster-egress.override` key in the kube-system
  # coredns-custom ConfigMap with one rewrite per egress Service, so pods
  # resolve each tailnet-fqdn to its egress proxy cluster-wide. Relies on
  # CoreDNS importing coredns-custom (k3s and AKS do); leave off elsewhere.
  corednsCustom: false

image:
  repository: ghcr.io/potatonode/headmaster
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Ingress controller configuration.
ingress:
  # Set to false to disable the Ingress controller entirely (e.g. when using
  # headmaster only to manage HeadscaleInstance lifecycles).
  enabled: true

# Controls default-handler ownership for Ingresses with no explicit
# headscale-namespace annotation.
#   null (default) — take ownership if unclaimed; gracefully back off if
#                    another deployment already holds it.
#   true           — forcibly take ownership, overwriting any stale claim.
#                    Use when intentionally migrating the default handler.
#   false          — do not claim default ownership; only process Ingresses
#                    that explicitly target this deployment.
claimDefault: ~

# Admission webhook for HeadscaleInstance config validation.
# Requires cert-manager to be installed in the cluster.
webhook:
  enabled: false

rustLog: info

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
